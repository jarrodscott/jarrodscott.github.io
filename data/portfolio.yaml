projects:
  - id: "hypocolypse"
    title: "1. Hypocolypse: Rapid ecosystem-scale consequences of acute deoxygenation on a Caribbean coral reef"
    hook: "What are the ecosystem-scale effects of acute deoxygenation events and subsequent recovery dynamics of microbial communities on coral reefs?"
    hero_image: "tiny-health/hypocolypse.png"
    hero_alt: "PCoA plot showing a distinct state transition at day 30 post-infection"
    modalities:
      - "Shotgun Metagenomics"
      - "16S rRNA Amplicon"
    approaches:
      - "Taxonomic profiling"
      - "alpha/beta diversity"
      - "Differential abundance"
      - "Phylogenetics"
      - "Co-assembly"
      - "Manual binning"
      - "MAG refinement & curation"
      - "Phylogenomics"
      - "Functional analysis"
      - "Metabolic profiling"

    stack:
      - "R/Python"
      - "Cutadapt"
      - "DADA2"
      - "Phyloseq"
      - "ARB-Silva"
      - "Trimmomatic"
      - "Snakemake"
      - "anvi'o"
      - "CheckM"
      - "MEGAHIT"
      - "Bowtie 2/SAMtools"
      - "Prodigal"
      - "CONCOCT"
      - "DAS Tool"      
      - "Kraken"
      - "MUSCLE"
      - "VirSorter"
      - "Pfam"
      - "COG"
      - "KEGG/KOfam"

    methodology: "I processed raw 16S rRNA amplicon sequencing data using DADA2, assessed taxonomic diversity, computed alpha & beta diversity, and assessed differential abundance analysis. I also processed raw shotgun metagenomic sequences, reconstructed MAGs, performed functional annotation of assembled contigs, and phylogenomic analysis."
    github_url: "https://github.com/hypocolypse/web"
    publication_url: "https://doi.org/10.1038/s41467-021-24777-3" 
    workflow_url: "https://hypocolypse.github.io/" 
    impact: "We found that sonditions associated with the event precipitated coral bleaching and mass mortality, causing a 50% loss of live coral and a shift in the benthic community that persisted a year later. Conversely, the  hypoxia-associated microbes rapidly reverted to a normoxic assemblage one month after the event. The decoupling of ecological trajectories among these major functional groups following an acute event emphasizes the need to incorporate deoxygenation as an emerging stressor into coral reef research and management plans to combat escalating threats to reef persistence."

  - id: "project-digest"
    title: "2. ProjectDIGEST: Intestinal microbes as an axis of functional diversity among large marine consumers"
    hook: "Microbes are ubiquitous, yet the manner and extent of their influence on the ecology and evolution of large, marine mobile fauna remains poorly understood."
    hero_image: "tiny-health/digest.png"
    hero_alt: "Network graph visualizing tightly clustered genetic hubs"
    modalities:
      - "16S rRNA Amplicon"
    approaches:
      - "Taxonomic profiling"
      - "alpha/beta diversity"
      - "Differential abundance"
      - "Phylogenetics"
    stack:
      - "R/Python"
      - "Cutadapt"
      - "DADA2"
      - "Phyloseq"
      - "ARB-Silva"
      - "LEfSe"

    methodology: "I processed raw 16S rRNA amplicon sequencing data using DADA2, assessed taxonomic diversity, computed alpha & beta diversity, and assessed differential abundance analysis. "
    github_url: "https://github.com/projectdigest/web/"
    publication_url: "https://doi.org/10.1098/rspb.2019.2367" 
    workflow_url: "https://projectdigest.github.io/" 
    impact: "We demonstrate that five common Caribbean fish species display marked differences in where they feed and what they feed on. We foundthat interspecific trait differences are even more pronounced when considering the herbivore intestinal microbiome. Microbiome composition was highly species specific. Phylogenetic comparison of the dominant microbiome members to all known microbial taxa suggest that microbiomes are comprised of putative environmental generalists, animal-associates and fish specialists (resident symbionts), the latter of which mapped onto host phylogeny. Putative symbionts are most similar to those that occupy the intestines of ecologically and evolutionarily related herbivorous fishes in more distant ocean basins. Our findings therefore suggest that the intestinal microbiome may be an important functional trait among these large-bodied consumers."

  - id: "anvio"
    title: "3. Picture the unseen: Analysis and visualization of ‘Omics data using anvi'o"
    hook: "Demystifying the invisible world of microbial ecology through analogy and visualizations."
    hero_image: "tiny-health/anvio.png"
    hero_alt: "Network graph visualizing tightly clustered genetic hubs"
    modalities:
      - "Shotgun Metagenomics"
    approaches:
      - "Pangenomics"
      - "Phylogenomics"
      - "Co-assembly"
      - "Manual binning"
      - "MAG refinement & Curation"
      - "Metabolic profiling"
      - "homology modelling"
    stack:
      - "anvi'o"
      - "Snakemake"
      - "R/Python"
      - "CheckM"
      - "MEGAHIT"
      - "KEGG/KOfam"
      - "Trimmomatic"
      - "DAS Tool"
      - "Bowtie 2/SAMtools"
      - "Prodigal"
      - "CONCOCT"
      - "Kraken"
      - "MUSCLE"
      - "VirSorter"
      - "MODELLER"
    methodology: "I processed raw shotgun metagenomic sequences, reconstructed MAGs, performed functional annotation of assembled contigs, and predicted differences in protein structure based on sequence variants."
    publication_url: "https://stri.si.edu/story/picture-unseen" 
    impact: "Though MAG-01 was abundant in both oceans, the Eastern Pacific and Western Atlantic differ dramatically in their geochemical and physical properties. One way to understand how the environment may shape genome evolution is to inspect gene-level variability profiles (e.g., codons or amino acids). The profile shown  indicates greater variability in the Eastern Pacific metagenome. Variable residues were mapped onto the predicated structure of the resulting protein. Changes in amino acid sequence can alter the shape of a protein, and such changes may influence the protein’s function."
