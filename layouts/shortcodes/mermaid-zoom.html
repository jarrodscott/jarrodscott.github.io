<div class="mobile-zoom-graph" onclick="toggleZoomGraph(this, event)">
  <button type="button" class="zoom-close-btn" aria-label="Close zoomed view" onclick="toggleZoomGraph(this.parentElement, event)">✕</button>
  {{ .Inner }}
</div>

<script>
  if (!window.__zoomGraphEscInit) {
    window.__zoomGraphEscInit = true;
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" || e.keyCode === 27) {
        document.querySelectorAll(".mobile-zoom-graph.expanded").forEach(function(el) {
          el.classList.remove("expanded");
        });
      }
    });
  }

  function toggleZoomGraph(el, event) {
    // If clicking directly on the close button, close and prevent event bubbling
    if (event.target.classList.contains("zoom-close-btn")) {
      event.stopPropagation();
      el.classList.remove("expanded");
      return;
    }
    el.classList.toggle("expanded");
  }
</script>
