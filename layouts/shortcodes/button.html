{{- $href := "" -}}
{{- with .Get "pageRef" -}}
  {{- $href = relref $.Page . -}}
{{- else -}}
  {{- $href = $.Get "href" -}}
{{- end -}}
<a
  class="bio-dashboard-btn text-neutral-700 dark:text-neutral-300 hover:text-primary-500 dark:hover:text-primary-400 hover:border-primary-500 dark:hover:border-primary-400"
  {{ with $href }}href="{{ . }}"{{ end }}
  {{ with .Get "target" }}target="{{ . }}"{{ end }}
  {{ with .Get "rel" }}rel="{{ . }}"{{ end }}
  role="button">
  {{ .Inner }}
</a>
