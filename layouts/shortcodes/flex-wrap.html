{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "Image" -}}
{{- $width := .Get "width" | default "160px" -}}

<!-- Outer element as a semantic paragraph block to enforce theme line binding -->
<p class="true-wrap-container block my-6 max-w-full clearfix" style="display: block !important;">
  
  <!-- Right-floating Image Frame -->
  <span class="wrap-image-frame" style="display: block; --desktop-width: {{ $width }};">
    <!-- FIX: Forcing Hugo to process the image as standard Markdown inside your Page Bundle -->
    {{ printf "![%s](%s)" $alt $src | $.Page.RenderString }}
  </span>

  <!-- Markdown text content streams here inside the same structural lane -->
  {{ .Inner | markdownify }}

  <span style="clear: both; display: block; width: 100%;"></span>
</p>
