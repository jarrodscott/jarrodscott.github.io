# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters
# #blowfish (default), avocado, fire, ocean, forest, princess, neon, bloody, terminal, marvel, noir, autumn, congo, slate, github, and one-light
colorScheme = "default" 
defaultAppearance = "light"
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
mainSections = [ "study" ]
firebase = { }
fathomAnalytics = { }
verification = { }
enableA11y = true

defaultBackgroundImage = "" # used as default for background images

[header]
layout = "fixed"
theme_picker = true  # 

[footer]
showCopyright = true
showThemeAttribution = true
showAppearanceSwitcher = true
showScrollToTop = true

[homepage]
layout = "custom"
homepageImage = "images/bretz_map.png"
showRecent = false
showRecentItems = 4
showMoreLink = false
showMoreLinkDest = "/about"
cardView = false
cardViewScreenWidth = false
layoutBackgroundBlur = true


[article]
showDate = false
showDateUpdated = true
showAuthor = false
showHero = false
heroStyle = "basic"
showBreadcrumbs = true
showDraftLabel = true
showEdit = true
editAppendPath = true
seriesOpened = false
showHeadingAnchors = false
showPagination = false
invertPagination = false
showReadingTime = true
showTableOfContents = true
showTaxonomies = false
showAuthorsBadges = false
showWordCount = true
showSummary = true
showAuthorBottom = true
layoutBackgroundHeaderSpace = ""

[list]
showHero = false
heroStyle = "background"
layoutBackgroundHeaderSpace = false
showBreadcrumbs = true
showSummary = true
showTableOfContents = true
showCards = true
groupByYear = false
cardView = true
cardViewScreenWidth = false

[sitemap]
excludedKinds = [ ]

[taxonomy]
showTermCount = true
